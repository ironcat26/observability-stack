- name: Ensure Grafana dashboards provisioning dir exists (providers)
  ansible.builtin.file:
    path: /etc/grafana/provisioning/dashboards
    state: directory
    owner: root
    group: grafana
    mode: '0750'

- name: Ensure Grafana dashboards data dir exists (JSON)
  ansible.builtin.file:
    path: /usr/local/grafana/conf/provisioning/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'

- name: Copy dashboard provider config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/dashboards/default.yml"
    dest: /etc/grafana/provisioning/dashboards/default.yml
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart grafana

- name: Copy dashboard JSON files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/grafana/conf/provisioning/dashboards/
    owner: grafana
    group: grafana
    mode: '0644'
  loop:
    - "{{ playbook_dir }}/../monitoring/grafana/dashboards/node-overview.json"
    - "{{ playbook_dir }}/../monitoring/grafana/dashboards/services-health.json"
  notify: Restart grafana
