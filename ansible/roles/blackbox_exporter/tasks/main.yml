---
- name: Create blackbox user
  ansible.builtin.user:
    name: blackbox
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: Download and unarchive blackbox_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/blackbox_exporter/releases/download/v0.25.0/blackbox_exporter-0.25.0.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: yes
    creates: /tmp/blackbox_exporter-0.25.0.linux-amd64/blackbox_exporter

- name: Move binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/blackbox_exporter-0.25.0.linux-amd64/blackbox_exporter
    dest: /usr/local/bin/blackbox_exporter
    mode: '0755'
    remote_src: yes

- name: Create config directory
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    mode: '0755'

- name: Copy blackbox config
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/blackbox_exporter/blackbox.yml
    mode: '0644'
  notify: restart blackbox

- name: Create systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/blackbox_exporter.service
    content: |
      [Unit]
      Description=Blackbox Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=blackbox
      Group=blackbox
      Type=simple
      ExecStart=/usr/local/bin/blackbox_exporter --config.file=/etc/blackbox_exporter/blackbox.yml

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: restart blackbox

- name: Enable and start blackbox
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: started
    enabled: yes
    daemon_reload: yes
